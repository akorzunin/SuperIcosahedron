# https://taskfile.dev

version: "3"

output: "prefixed"

vars:
  APP_NAME:
    sh: >-
      {{if eq OS "linux"}}
        echo "SuperIcosahedron-$(./scripts/get_version.sh --short)-$(./scripts/get_version.sh --tag)"
      {{ end }}
  BUILD_TAG:
    sh: >-
      {{if eq OS "linux"}}
        echo "$(./scripts/get_version.sh --tag)-$(./scripts/get_version.sh --short)"
      {{ end }}
  BUILD_DIR:
    sh: >-
      {{if eq OS "linux"}}
        echo "./build/{{ .BUILD_TAG }}"
      {{ end }}

tasks:
  default:
    cmds:
      - echo "run task -l or task --list-all to see all avaliable tasks"
    silent: true

  format-shaders:
    desc: format all ".gdshader" files w/ clang-format
    cmds:
      - |
        {{if eq OS "windows"}}
          powershell -c '
          $files=(git ls-files --exclude-standard); foreach ($file in $files) {
              if ((get-item $file).Extension -in ".gdshader", ".gdshaderinc", ".glsl", ".glslv", ".glslf")
              { clang-format -i -style=file $file }
          }'
        {{else}}
          git ls-files --exclude-standard |
          grep -E '\.(gdshader|gdshaderinc|glsl|glslv|glslf)$' |
          xargs clang-format -i -style=file
        {{end}}
    sources:
      - "**/*.gdshader"
      - "**/*.gdshaderinc"

  check:
    desc: run linters and formatters
    aliases: [fmt]
    deps:
      - format-shaders
    cmds:
      - pre-commit run --all-files --color always
    sources:
      - ./src/*
      - ./assets/*
      - ./web/*

  gd-dev-build-web:
    internal: true
    cmds:
      - rm -f ./build/web/* || true
      - rm -rf {{ .BUILD_DIR }}/web || true
      - mkdir -p {{ .BUILD_DIR }}/web
      - godot --headless --export-debug "Web" {{ .BUILD_DIR }}/web/index.html
      - cp -r {{ .BUILD_DIR }}/web ./build/

  dev-build-web:
    platforms: [linux]
    desc: build project for web
    deps:
      - check
      - build-check
      - disable-discord-rpc
    cmds:
      - defer: { task: build-cleanup }
      - defer: { task: enable-discord-rpc }
      - task: gd-dev-build-web

  preview-web-build:
    desc: preview web build from ./build/web in browser
    dir: ./build/web
    cmds:
      - >-
        {{if eq OS "windows"}} powershell {{end}}
        start http://localhost:8000
      - caddy file-server --listen 0.0.0.0:8000 --browse

  gd-dev-build-windows:
    internal: true
    cmds:
      - rm -f {{.BUILD_DIR}}/pc/*.exe || true
      - mkdir -p {{.BUILD_DIR}}/pc
      - >-
        godot --headless --export-debug "Windows Desktop" --rendering-method forward_plus
        {{.BUILD_DIR}}/pc/{{.APP_NAME}}-dev.exe

  dev-build-windows:
    platforms: [linux]
    desc: build project for windows pc
    deps:
      - check
      - build-check
      - enable-discord-rpc
    cmds:
      - defer: { task: build-cleanup }
      - task: gd-dev-build-windows

  gd-dev-build-linux:
    internal: true
    cmds:
      - rm -f {{.BUILD_DIR}}/linux/*.x86_64 || true
      - mkdir -p {{.BUILD_DIR}}/linux
      - >-
        godot --headless --export-debug "Linux/X11" --rendering-method forward_plus
        {{.BUILD_DIR}}/linux/{{.APP_NAME}}-dev.x86_64

  dev-build-linux:
    platforms: [linux]
    desc: build project for linux pc
    interactive: true
    deps:
      - check
      - build-check
      - enable-discord-rpc
    cmds:
      - defer: { task: build-cleanup }
      - task: gd-dev-build-linux

  gd-dev-build-android:
    internal: true
    cmds:
      - rm -f {{.BUILD_DIR}}/android/*.apk || true
      - mkdir -p {{.BUILD_DIR}}/android
      - >-
        godot --headless --export-debug "Android"
        {{.BUILD_DIR}}/android/{{.APP_NAME}}-dev.apk

  dev-build-android:
    platforms: [linux]
    desc: build project for android
    interactive: true
    deps:
      - check
      - build-check
      - disable-discord-rpc
    cmds:
      - defer: { task: build-cleanup }
      - defer: { task: enable-discord-rpc }
      - task: gd-dev-build-android

  gd-dev-build-with-discord-rpc:
    internal: true
    deps:
      - gd-dev-build-windows
      - gd-dev-build-linux
    cmd: echo windows and linux Build for app {{.APP_NAME}} completed

  gd-dev-build-no-discord-rpc:
    internal: true
    deps:
      - gd-dev-build-web
      - gd-dev-build-android
    cmd: echo web  and android Build for app {{.APP_NAME}} completed

  build-parallel:
    internal: true
    cmds:
      - defer: { task: enable-discord-rpc }
      - task: enable-discord-rpc
      - task: gd-dev-build-with-discord-rpc
      - task: disable-discord-rpc
      - task: gd-dev-build-no-discord-rpc
      - echo Build for app {{.APP_NAME}} completed

  dev-build-all:
    platforms: [linux]
    desc: build for all platforms
    interactive: true
    aliases: [all]
    deps:
      - check
      - build-check
    cmds:
      - defer: { task: build-cleanup }
      - task: build-parallel

  deploy-dev-internal:
    internal: true
    cmds:
      - >-
        ansible-playbook
        ./deploy/dev/deploy_local.yaml -l local_pi,
        --verbose --vault-password-file ~/.ansible_vault_password
        --e "BUILD_TAG={{ .BUILD_TAG }}"

  deploy-dev:
    platforms: [linux]
    desc: upload build files to file server
    interactive: true
    cmds:
      - { task: deploy-dev-internal }

  deploy-build-dev:
    platforms: [linux]
    aliases: [deploy]
    desc: build for all platforms and upload files to file server
    interactive: true
    deps:
      - dev-build-all
    cmds:
      - { task: deploy-dev-internal }

  caddy:
    desc: run reverce proxy to view web build and file server locally
    preconditions:
      - sh: type caddy
        msg: caddy not found
    cmds:
      - caddy run --config ./deploy/dev/Caddyfile.local --watch --adapter caddyfile

  build-check:
    desc: run prebuild scripts
    cmds:
      - python ./scripts/on_build.py
      - { task: gen-version-file }

  build-cleanup:
    desc: run afterbuild scripts
    cmds:
      - python ./scripts/on_build.py --cleanup

  web-dev-server:
    desc: start vite dev server
    interactive: true
    env:
      VITE_GAME_VERSION: v0.0.0
      VITE_GAME_COMMIT: taskbld01
      VITE_HOST_URL: https://supericosahedron.localhost
      VITE_OG_DESCRIPTION: Aboba
    preconditions:
      - sh: >-
          {{if eq OS "linux"}}
            test pnpm
          {{ end }}
        msg: pnpm not found
    dir: web
    cmds:
      - pnpm i
      - pnpm run dev

  debug-web:
    aliases: [dw]
    desc: run dev server and local reverse proxy for web at https://supericosahedron.localhost/
    deps:
      - caddy
      - web-dev-server
    cmds:
      - echo "debug session ended"

  setup-rclone:*:*:
    desc: setup rclone
    vars:
      USERMAIL: "{{index .MATCH 0}}"
      PASSWORD: "{{index .MATCH 1}}"
    cmds:
      - rclone config create ico-sync mega user={{.USERMAIL}} pass={{.PASSWORD}} --non-interactive
      - task: check-rclone

  check-rclone:
    preconditions:
      - sh: rclone lsd ico-sync:ico-sync
        msg: "WARNING: rclone cant find remote ico-sync: run \u001b[1;32mtask setup-rclone:USERMAIL:PASSWORD\u001b[0m"
    cmds:
      - rclone version

  pull-assets:
    desc: download assets from the cloud
    deps:
      - check-rclone
    prompt: This is command will replace your LOCAL assets Do you want to continue?
    cmds:
      - rclone copy ico-sync:ico-sync/assets ./assets --progress --update

  push-assets:
    desc: download assets from the cloud
    deps:
      - check-rclone
    prompt: This is command will update CLOUD assets Do you want to continue?
    cmds:
      - rclone copy ./assets ico-sync:ico-sync/assets --progress --update

  gen-version-file:
    desc: ...
    cmds:
      - python ./scripts/generate_version.py

  enable-discord-rpc:
    desc: enable discord-rpc-gd addon
    cmd: >-
      git apply ./scripts/no-discord-rpc-project.godot.diff --reverse || true

  disable-discord-rpc:
    desc: disable discord-rpc-gd addon
    cmd: >-
      git apply ./scripts/no-discord-rpc-project.godot.diff || true

  docker-image:
    desc: build the godot builder docker image
    cmds:
      - docker build -t supericosahedron-godot-builder .

  docker-build:
    desc: build a specific platform via docker
    summary: |
      Usage: task docker-build -- <platform> [build_type]
      Platforms: all  linux  windows  web  android
      Build type: debug (default)  release
    cmds:
      - docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) -v ${PWD}:/project supericosahedron-godot-builder {{.CLI_ARGS}}

  docker-build-all:
    desc: build all platforms via docker (debug)
    aliases: [da]
    cmds:
      - docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) -v ${PWD}:/project supericosahedron-godot-builder all debug

  docker-build-linux:
    desc: build linux via docker (debug)
    aliases: [dl]
    cmds:
      - docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) -v ${PWD}:/project supericosahedron-godot-builder linux debug

  docker-build-windows:
    desc: build windows via docker (debug)
    aliases: [dw]
    cmds:
      - docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) -v ${PWD}:/project supericosahedron-godot-builder windows debug

  docker-build-web:
    desc: build web via docker (debug)
    aliases: [dweb]
    cmds:
      - docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) -v ${PWD}:/project supericosahedron-godot-builder web debug

  docker-build-android:
    desc: build android apk via docker (debug)
    aliases: [dapk]
    cmds:
      - docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) -v ${PWD}:/project supericosahedron-godot-builder android debug

  docker-release-all:
    desc: build all platforms via docker (release)
    aliases: [dra]
    cmds:
      - docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) -v ${PWD}:/project supericosahedron-godot-builder all release

  docker-release-linux:
    desc: build linux via docker (release)
    aliases: [drl]
    cmds:
      - docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) -v ${PWD}:/project supericosahedron-godot-builder linux release

  docker-release-windows:
    desc: build windows via docker (release)
    aliases: [drw]
    cmds:
      - docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) -v ${PWD}:/project supericosahedron-godot-builder windows release

  docker-release-web:
    desc: build web via docker (release)
    aliases: [drweb]
    cmds:
      - docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) -v ${PWD}:/project supericosahedron-godot-builder web release

  docker-release-android:
    desc: build android apk via docker (release)
    aliases: [drapk]
    cmds:
      - docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) -v ${PWD}:/project supericosahedron-godot-builder android release
